<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04060d" />
    <meta
      name="description"
      content="Fictional cinematic digital-twin visualization of a hypothetical asteroid impact near Puerto Rico. NOT a real forecast or emergency tool."
    />
    <title>Caribbean Asteroid Twin — Fictional Simulation</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #04060d; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #04060d; color: #6ee7ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px; letter-spacing: 0.2em; z-index: 9999;
      }
      #boot .dot { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { opacity: 0.2; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <span>INITIALIZING DIGITAL TWIN<span class="dot">...</span></span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const b = document.getElementById('boot');
          if (b) b.remove();
        }, 350);
      });
    </script>
  </body>
</html>
